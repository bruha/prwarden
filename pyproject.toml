# Packaging only: PR Warden has no runtime dependency, and a source checkout runs
# with `python3 -m prwarden` without installing anything. The build backend is
# pinned. Releases, Homebrew, and pip on Python 3.10 or newer build with a current
# setuptools; only a build from source on Python 3.9 takes 82.0.1, the last release
# that runs there. Its two advisories, GHSA-h35f-9h28-mq5c and GHSA-xmj3-9gf7-h52w,
# need a MANIFEST.in and namespace packages respectively, and this project has
# neither.
[build-system]
requires = [
    "setuptools==84.2.1; python_version >= '3.10'",
    "setuptools==82.0.1; python_version < '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "prwarden"
dynamic = ["version"]
description = "Self-hosted AI pull-request reviewer built on the AI and GitHub CLIs you already use"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Pylyp Borysov" }]
keywords = ["ai", "code-review", "github", "llm", "pull-requests"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/bruha/prwarden"
Issues = "https://github.com/bruha/prwarden/issues"
Changelog = "https://github.com/bruha/prwarden/blob/main/CHANGELOG.md"

[project.scripts]
prwarden = "prwarden.cli:main"

[tool.setuptools]
packages = ["prwarden"]
include-package-data = false

[tool.setuptools.package-data]
prwarden = ["templates/github-comment.md", "templates/github-comment-tags.json"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
