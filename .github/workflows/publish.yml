name: Publish

# A release tag publishes that release to PyPI. The upload uses PyPI trusted
# publishing, so no password or token is stored anywhere, and it waits in the
# `pypi` environment until the maintainer approves it.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Check the tag names the version being built
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python -m pip install build==1.6.1
      # The wheel is built from the source archive, so a file the archive leaves
      # out fails here rather than for whoever installs from source.
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prwarden/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
